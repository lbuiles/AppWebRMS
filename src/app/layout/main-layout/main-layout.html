<div class="flex h-screen overflow-hidden relative">
  <!-- Punto 2 (semana 39): backdrop para cerrar el menú en móvil al tocar fuera -->
  @if (menuService.menuOpen$ | async) {
    <div class="fixed inset-0 z-40 bg-black/40 md:hidden" (click)="menuService.close()"></div>
  }
  <app-sidebar></app-sidebar>

  <div class="flex-1 flex flex-col overflow-hidden">
    <app-header></app-header>

    <main class="flex-1 overflow-x-hidden overflow-y-auto p-6 bg-gray-100">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
