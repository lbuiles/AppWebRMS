<aside class="fixed lg:static inset-y-0 left-0 z-50 h-dvh w-64 max-w-[85vw] bg-[#111827] text-white flex flex-col shadow-2xl transition-transform duration-300 transform lg:translate-x-0"
       [class.-translate-x-full]="!(menuService.menuOpen$ | async)">

  <button type="button" (click)="menuService.close()" aria-label="Cerrar menú"
          class="lg:hidden absolute top-2 right-2 z-10 p-2 text-gray-400 hover:text-white rounded-lg">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
  </button>

  <a routerLink="/panel" class="h-20 flex flex-col items-center justify-center border-b border-gray-800 px-6 relative cursor-pointer hover:bg-gray-800/60 transition-colors" title="Volver al Panel de Control">
    <img src="/logo_rms.png" alt="Logo RMS" class="h-10 w-auto mb-1 brightness-0 invert">
    <p class="text-[10px] text-[#ffb31c] uppercase tracking-widest font-bold">Diseño y Construcción</p>
  </a>

  <nav class="flex-1 overflow-y-auto py-6 px-3 space-y-1">
    @for (item of menuItems(); track item.id) {

      <!-- Ítem principal -->
      <a [routerLink]="item.ruta"
         [ngClass]="itemActivo(item.ruta) ? 'bg-[#ffb31c] text-[#1e3a8a] shadow-lg font-bold translate-x-2' : ''"
         class="flex items-center gap-4 px-4 py-3 rounded-xl text-gray-400 hover:text-white hover:bg-gray-800 transition-all group cursor-pointer text-sm font-medium">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.icono"/>
        </svg>
        <span class="tracking-wide">{{ item.nombre }}</span>
      </a>

      <!-- Sub-ítem Reportes (solo bajo el módulo de Tareas) -->
      @if (item.ruta === '/tareas' && auth.hasPermission('tareas.reportes')) {
        <a routerLink="/tareas/reportes"
           routerLinkActive="bg-[#ffb31c] text-[#1e3a8a] font-bold"
           class="flex items-center gap-3 pl-11 pr-4 py-2 rounded-xl text-gray-500 hover:text-white hover:bg-gray-800 transition-all text-xs font-medium ml-1">
          <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
          </svg>
          Reportes de cumplimiento
        </a>
      }

      <!-- Sub-ítem Cuadrillas (bajo el módulo de Proyectos) -->
      @if (item.ruta === '/proyectos' && auth.hasPermission('proyectos.cuadrillas.ver')) {
        <a routerLink="/proyectos/cuadrillas"
           routerLinkActive="bg-[#ffb31c] text-[#1e3a8a] font-bold"
           class="flex items-center gap-3 pl-11 pr-4 py-2 rounded-xl text-gray-500 hover:text-white hover:bg-gray-800 transition-all text-xs font-medium ml-1">
          <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
          Cuadrillas
        </a>
      }

    }
  </nav>

</aside>
